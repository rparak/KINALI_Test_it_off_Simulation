## =========================================================================== ##
#   Description:
#     The simulation-only data of the Test-it-off cell program: what the simulated cell needs and a real
#     controller would not run - the start state, the model sites of the tools, the simulated actuator of each
#     output and the response time of each input, where the jaws really stop, the settle time at the end, the
#     contacts each segment may have, and each point's scene for the keypoint tools (SPEC §8). Read only by
#     src/Configuration/Program_Parser.py (Load_Simulation); written by hand. Names are the constants of
#     Configuration/Constants.yaml and the segment names of Configuration/Program.yaml.
#
#   REQUIRED: every field is required (PCB_Hold is null on a point without one; Contacts [] when none); a
#     missing or invalid field fails the load, naming it.
#   Units: times [s], lengths [m], angles [deg].
## =========================================================================== ##

# The state of the cell before the program's first segment.
Start:
  # The robot point. REQUIRED.
  Robot: P_HOME
  # The loader position and the gripper command (Constants.yaml). REQUIRED.
  Loader: L_HOME
  Gripper: G_OPEN
  # The vacuum: ON or OFF. REQUIRED.
  Vacuum: OFF
  # Where the PCB is: input_crate, cups, jaws, mg06 or output_crate. REQUIRED.
  PCB: input_crate
  # MG06: Open or Closed. REQUIRED.
  MG06: Open

# The model site that is each tool's frame (the IK and the checks run on it). REQUIRED for every tool.
Tool_Site:
  T_SUCTION: aubo/tool/suction_tcp
  T_FLANGE: aubo/tool/tool_flange

# The simulated actuator each digital output drives (vacuum: the four cups' adhesion). REQUIRED for every DO.
Actuators:
  DO_VACUUM: vacuum

# How long a digital input takes to come after its cause; the simulated WaitDI waits what is left of it (nothing
# once it has come) and fails when it exceeds the program's timeout. DI_VACUUM_OK: the legacy planner's 0.3 s hold
# after vacuum on (git tag legacy-planner-reference). [s] REQUIRED for every DI.
Signal_Response:
  DI_VACUUM_OK: 0.3

# The simulated vacuum switch (F11, owner 2026-10-24): in physics DI_VACUUM_OK is true only while at least this
# many of the VGC10's four cups have touched the PCB for its Signal_Response; a WaitDI on it fails otherwise (the
# program stops: vacuum not OK). The kinematic build does not use it (it holds the PCB on the cups by its rules).
# [cups, 1-4] REQUIRED.
Vacuum_OK_Min_Cups: 4

# Where the jaws really stop when a gripper command closes them on the PCB (the 40 N force limit holds them on
# its edges): the former pcb_meta.json jaw_grip (SPEC §4.4). Posing and the checks use it. [m]
Jaw_Actual:
  G_CLAMP: 0.017750000000000002

# Everything holds this long after the program's last segment, so the PCB settles in the output crate before
# the simulated cycle ends (the legacy planner's final hold(0.8); not part of the real cell's program). [s] REQUIRED.
End_Settle: 0.8

# The contact groups (Cell.yaml Clearance.Allowed_Depth) each segment may have within the clearance, by the
# segment's name without its S<n>_ prefix; an unlisted segment is contact-free; each listed group must occur.
Allow_Contact:
  Pick_Input: [cups_pcb, pcb_crate]
  To_Loader: [cups_pcb]
  Handover: [cups_pcb, pcb_jaws]
  Close_MG06: [handle_bar]
  Open_MG06: [handle_bar]
  Take_From_Loader: [cups_pcb, pcb_jaws]
  To_Output: [cups_pcb]
  Place_Output: [cups_pcb, pcb_crate]

# Each point's scene for the keypoint check, show and step tools (SPEC §7.7): Context (the loader position, the
# gripper command - posed at its Jaw_Actual -, the PCB location), Fixture (MG06: Open, Closed = Cell.yaml MG06, or
# the recorded {Lid, Handle [deg], Source}), Contacts (the groups allowed within the clearance there), PCB_Hold
# (null, or the PCB location whose hold pose the point is, moved by Offset [m] along the tool axes: checked like an
# offset, within the stale tolerance).
Points:
  P_HOME:
    Context: {Loader: L_HOME, Gripper: G_OPEN, PCB: input_crate}
    Fixture: Open
    Contacts: []
    PCB_Hold: null
  P_INPUT_ABOVE:
    Context: {Loader: L_HOME, Gripper: G_OPEN, PCB: input_crate}
    Fixture: Open
    Contacts: []
    PCB_Hold: null
  P_INPUT_APPROACH:
    Context: {Loader: L_HOME, Gripper: G_OPEN, PCB: input_crate}
    Fixture: Open
    Contacts: []
    PCB_Hold: null
  P_INPUT_PICK:
    Context: {Loader: L_HOME, Gripper: G_OPEN, PCB: input_crate}
    Fixture: Open
    Contacts: [cups_pcb]
    PCB_Hold: {Location: input_crate, Offset: [0.0, 0.0, 0.0015]}
  P_INPUT_CLEAR:
