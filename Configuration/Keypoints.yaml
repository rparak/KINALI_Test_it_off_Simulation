# Loader positions: the Y (towards MG06) and Z (up) axis set-points. Source: the loader's former
# Data/PCB/pcb_meta.json fields y_home, y_place, z_place (moved here, owner 2026-10-24) and the legacy
# planner (git tag legacy-planner-reference: Z_TRAVEL = place + 12 mm; park Y_PARK, Z_PARK); SPEC §4.4.
Loader:
  # The loader's home: the gripper where the CAD has it; the handover and take position. [m] REQUIRED.
  home: {Y: -0.1, Z: 0.0}
  # Above the MG06 holder, at the travel height (place + 12 mm). [m] REQUIRED.
  travel_place: {Y: 0.19665834418149383, Z: 0.07921731047501317}
  # The PCB placed in the MG06 holder. [m] REQUIRED.
  place: {Y: 0.19665834418149383, Z: 0.06721731047501317}
  # Parked while the robot closes and opens MG06. [m] REQUIRED.
  park: {Y: -0.1995, Z: 0.02}

# Gripper (SCHUNK EGI 040-EI) jaw set-points, per jaw. Source: the former pcb_meta.json jaw_open and
# jaw_grip; clamp = grip - 12 mm, the force-limited clamp command (SPEC §4.3, §4.4).
Gripper:
  # Fully open. [m] REQUIRED.
  open: 0.035
  # The jaws on the PCB's edges. [m] REQUIRED.
  grip: 0.017750000000000002
  # The clamp command: 12 mm behind the part, the 40 N force limit holds it. [m] REQUIRED.
  clamp: 0.005750000000000002
