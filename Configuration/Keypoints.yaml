## =========================================================================== ##
#   Description:
#     The named keypoints of Test-it-off Simulation: robot poses, loader positions and gripper states
#     (SPEC §2 item 3, §4.8). Read only by src/Configuration/Core.py (Load_Keypoints); written by hand.
#     A corrected Joints line comes from Example/Keypoints/resolve_keypoint.py, which prints it; nothing
#     writes this file.
#
#   REQUIRED: every field is required; a missing or invalid field fails the load, naming it.
#   Units: angles [deg] (converted once by the loader), lengths [m].
#   Joints: the six robot joints in the model's order and directions - shoulder_pan, shoulder_lift, elbow,
#     wrist_1, wrist_2, wrist_3 (the vendored MJCF's aubo/<name>_joint; their agreement with the AUBO
#     controller's convention is not verified, KNOWN_ISSUES.md). Joints are the source of truth: posing and
#     playback read them only, never an IK result.
#   Frames: positions in the MG06 fixture frame (SPEC §4.2); Check and Relative_To name their site:
#     suction_tcp (the cup face, 260.6 mm from the flange, tool +Z towards the cups) or tool_flange.
#   Full precision: every Joints value is the reference plan's (Data/Reference/cell_plan.npz) stationary
#     segment end of that keypoint (q_home for home), rounded to 1e-6 deg; within 1e-4 rad of the SPEC §4.8
#     table (SPEC §4.8, FEATURES.md F6).
#
#   Per robot keypoint:
#     Joints        the joint angles [deg].
#     Family        wrist_up (wrist_2 > 0, PCB handling) or wrist_down (wrist_2 < 0, the MG06 fork path).
#     Check         a site position the joints must reach within Cell.yaml Clearance.Check_Position.
#     Relative_To   null, or a target the joints must reach within the stale tolerance: Target is
#                   pcb_hold@<location> (the TCP holding the PCB there) or another keypoint; Offset [m] is
#                   in the Frame's axes (suction_tcp: +Z along the tool towards the cups).
#     Fixture       the MG06 state: Open, Closed (Cell.yaml MG06), or {Lid, Handle [deg], Source} from
#                   the recorded fork path; the press plate follows the handle through the model's coupling.
#     Context       the scene: Loader (a Loader position), Gripper (a Gripper state), PCB (input_crate,
#                   cups, jaws, mg06, output_crate).
#     Allow_Contact the contact groups allowed within the clearance (cups_pcb, handle_bar,
#                   pcb_crate), each up to Cell.yaml Clearance.Allowed_Depth; [] when none.
#     Note          what the keypoint is for (shown by the viewer and the check).
## =========================================================================== ##

