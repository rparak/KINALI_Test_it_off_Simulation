## =========================================================================== ##
#   Description:
#     The constants of the Test-it-off cell program: every named value the cell controllers use - the
#     robot's tools and points, the loader positions, the gripper commands, the recorded paths, the I/O
#     signals - declared once (SPEC §8). Configuration/Program.yaml uses them by name;
#     Configuration/Simulation.yaml holds what only the simulation needs. Read only by
#     src/Configuration/Program_Parser.py (Load_Constants); written by hand. A corrected point comes from
#     Example/Keypoints/resolve_keypoint.py, which prints its Joints and Pose lines; nothing writes this file.
#
#   REQUIRED: every field is required (Reference and Offset are null on a point that is not derived from
#     another); a missing or invalid field fails the load, naming it.
#   Names: UPPERCASE with the prefix of their section: T_ tool, P_ robot point, L_ loader position,
#     G_ gripper command, PATH_ recorded path, DO_ / DI_ digital output / input. Each has a one-line
#     Description. Every constant declared here is used by Program.yaml or Simulation.yaml.
#   Point roles (the name's last word): ABOVE the retreat height above a place, APPROACH 15 mm before
#     contact, PICK the cups pressed onto the PCB (vacuum on), PLACE the PCB set down (no press), EXIT out of
#     the jaws, CLEAR the PCB clear of the crate walls, WAIT where the robot waits during the test; VIA a
#     free-space via; the MG06 fork operations FORK_START (the recorded path's start and end), CLOSE_END
#     (the closing path's end), BAR_CENTRE (the bar centred in the fork slot), SLOT_EXIT (out of the bar
#     along the slot), OPEN_JOIN (where the opening path is joined).
#
#   Units: lengths [m], angles [deg], jaw [m per jaw].
#   Frames:
#     Joints   the six robot joints in the model's order and directions - shoulder_pan, shoulder_lift,
#              elbow, wrist_1, wrist_2, wrist_3 (their agreement with the AUBO controller's convention is not
#              verified, KNOWN_ISSUES.md). Joints are authoritative: they fix the pose and the IK family;
#              playback reads them only.
#     Pose     the point's tool frame in the ROBOT BASE frame (Configuration/Cell.yaml Robot.Base_Position,
#              Base_Yaw): [x, y, z, R, P, Y], position [m], orientation [deg] as fixed-axis roll, pitch,
#              yaw - R = Rz(Y) Ry(P) Rx(R) (to verify against the AUBO controller, KNOWN_ISSUES.md). A check
#              value: FK(Joints, Tool) must match it within 1e-5 m and 1e-3 deg.
#     Reference: <P_ constant> | null   the point this one is derived from
#     Offset: [dx, dy, dz] | null       displacement from Reference, in the Reference point's tool frame [m]
#              (T_SUCTION: +Z from the flange towards the cups); the point's FK must equal Reference's pose moved
#              by it within Cell.yaml Clearance.Stale_Position and Stale_Angle (0.05 mm, 0.01 deg).
#     Loader   Y towards MG06, Z up, the model's axis zeros (SPEC §4.10).
## =========================================================================== ##

# The tools on the flange: the tool frame's pose in the flange frame [x, y, z (m), R, P, Y (deg)].
