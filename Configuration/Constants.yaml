# The loader positions: the Y and Z axis set-points [m]. Source: the former Data/PCB/pcb_meta.json and the
# legacy planner (Z_TRAVEL = place + 12 mm; the park position), SPEC §4.4.
Loader_Positions:
  L_HOME:
    Description: "The loader's home: the gripper where the CAD has it; the handover and take position."
    Y: -0.1
    Z: 0.0
  L_TRAVEL:
    Description: "Above the MG06 holder, at the travel height (place + 12 mm)."
    Y: 0.19665834418149383
    Z: 0.07921731047501317
  L_PLACE:
    Description: "The PCB placed in the MG06 holder."
    Y: 0.19665834418149383
    Z: 0.06721731047501317
  L_PARK:
    Description: "Parked while the robot closes and opens MG06."
    Y: -0.1995
    Z: 0.02

# The gripper commands (SCHUNK EGI 040-EI), the jaw set-point per jaw [m]. Source: the former pcb_meta.json
# jaw_open; the clamp command 12 mm behind the part, held by the 40 N force limit (SPEC §4.3, §4.4).
Gripper_Commands:
  G_OPEN:
    Description: "Fully open."
    Jaw: 0.035
  G_CLAMP:
    Description: "Clamp: 12 mm behind the part; the force limit holds it (where the jaws stop: Simulation.yaml Jaw_Actual)."
    Jaw: 0.005750000000000002

# The recorded flange paths (SPEC §4.9): File (repository-relative), Phase (CLOSE: the rows from 1 to the last
# CLOSE row; OPEN: the OPEN rows after the join - the first with the handle below Cell.yaml MG06.Closed_Handle
# minus MG06.Open_Join_Margin), the points they start and end at.
Paths:
  PATH_FORK_CLOSE:
    Description: "Close MG06: lid down, handle to 29 deg, the bar on the fork slot's bottom."
    File: Data/Paths/fork_close_open_path.npz
    Phase: CLOSE
    Start: P_MG06_FORK_START
    End: P_MG06_CLOSE_END
  PATH_FORK_OPEN:
    Description: "Open MG06: the handle up, the lid up, the fork off the handle."
    File: Data/Paths/fork_close_open_path.npz
    Phase: OPEN
    Start: P_MG06_OPEN_JOIN
    End: P_MG06_FORK_START

# The digital signals. Port: a PLACEHOLDER - the real cell's I/O map is not defined (KNOWN_ISSUES.md).
Signals:
  DO_VACUUM:
    Description: "The VGC10 vacuum valve: ON sucks, OFF releases."
    Port: "placeholder, real-cell I/O map not defined"
  DI_VACUUM_OK:
    Description: "The VGC10 vacuum reached: the PCB is held."
    Port: "placeholder, real-cell I/O map not defined"
