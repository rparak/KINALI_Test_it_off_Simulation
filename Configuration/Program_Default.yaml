## =========================================================================== ##
#   Description:
#     The default program of Test-it-off Simulation: the whole cycle - the PCB from the input crate, through
#     the loader and the MG06 tester, to the output crate - as a human operator would teach it: sequential
#     steps, every motion ending at rest at its point, no blending, the robot and the loader never moving
#     at the same time, approach and retreat points as offsets from keypoints (SPEC §2 item 4, FEATURES.md
#     F8). Read only by src/Configuration/Core.py (Load_Program); written by hand.
#
#   REQUIRED: every field is required; a missing or invalid field fails the load, naming it.
#   Points: every robot point is a keypoint of Configuration/Keypoints.yaml; a command uses its stored
#     Joints. Loader and gripper names are that file's Loader positions and Gripper states.
#   Commands (one per list item):
#     Movej: <keypoint>                         min-jerk joint move at Cell.yaml Motion.Speed_Fraction
#     Movel: {To: <keypoint>, Speed: <m/s>}      straight TCP line, Speed = the peak TCP speed [m/s]
#     Path: Fork_Close | Fork_Open               the recorded MG06 fork path (SPEC §4.9)
#     Loader: {Axis: Y | Z, To: <position>, Duration: <s>}   one loader axis to that position's value [s]
#     Gripper: {To: <state>, Duration: <s>}      the jaw command [s]
#     Vacuum: On | Off                           the suction cups (an event, no time)
#     Wait: <s>                                  everything holds [s]
#     Test: Process.Test_Duration                the MG06 test: holds the Cell.yaml duration it names
#   Allow_Contact: the contact groups any sample of the step may have within Cell.yaml Clearance.Robot,
#     each no deeper than Cell.yaml Clearance.Allowed_Depth; every group declared must occur in the step.
#   Sources: every speed, duration and wait is the legacy planner's (git show
#     legacy-planner-reference:legacy/plan_cell.py, main), named per command as "legacy: <its call>".
## =========================================================================== ##

# The state of the cell before the first step.
Start:
  # The robot keypoint. REQUIRED.
  Robot: home
  # The loader position and the gripper state (Configuration/Keypoints.yaml). REQUIRED.
  Loader: home
  Gripper: open
  # The suction cups. REQUIRED.
  Vacuum: Off
  # Where the PCB is: input_crate, cups, jaws, mg06 or output_crate. REQUIRED.
  PCB: input_crate
  # MG06: Open or Closed. REQUIRED.
  MG06: Open

# The steps, in the order they run.
Steps:
  - Name: approach_input
    Comment: "From home to 120 mm above the PCB in the input crate, through free space."
    Allow_Contact: []
    Commands:
      - Movej: above_input_pcb                      # legacy: joint_move(q_pa, 'home -> above crate 1')

  - Name: pick_input
    Comment: >-
      Straight down to 15 mm above the PCB, the last 15 mm at 30 mm/s until the cups are pressed 1.5 mm onto it
      (SPEC §4.7), vacuum on, let it build up, straight up until the board clears the crate's 149 mm walls.
    Allow_Contact: [cups_pcb, pcb_crate]
    Commands:
      - Movel: {To: input_pcb_approach, Speed: 0.20}   # legacy: linear_move(..., 'down into crate 1', speed=0.20)
      - Movel: {To: input_pcb_press, Speed: 0.03}      # legacy: linear_move(..., 'cups onto the PCB', speed=0.03)
      - Vacuum: On                                     # legacy: event('suction_on')
      - Wait: 0.3                                      # legacy: hold(0.3)
      - Movel: {To: input_pcb_clear, Speed: 0.20}      # legacy: linear_move(..., 'up out of the crate', speed=0.20), to 120 mm:
                                                       # the board was still below the walls (1.64 mm from one, F8.5)

  - Name: to_loader
    Comment: >-
      Carry the PCB, clear of the crate, over a free-space via to 160 mm above the loader jaws, along the plate
      normal, so the board does not swing over the crates or MG06's front.
    Allow_Contact: [cups_pcb]
    Commands:
      - Movej: via_input_to_loader                  # legacy: the via joint_move inserted (SPEC §4.10)
      - Movej: above_loader                         # legacy: joint_move(q_via, 'above crate -> above the loader')

  - Name: handover
    Comment: >-
      Down along the plate normal into the open jaws, the last 15 mm at 30 mm/s, to the hold pose with no press:
      the board stays 0.3 mm above the finger ledges (SPEC §4.7). The jaws clamp, vacuum off, straight back up.
    Allow_Contact: [cups_pcb, pcb_jaws]
    Commands:
      - Movel: {To: loader_approach, Speed: 0.20}      # legacy: linear_move(..., 'down to the loader', speed=0.20)
      - Movel: {To: loader_handover, Speed: 0.03}      # legacy: linear_move(..., 'PCB into the open jaws', speed=0.03)
      - Gripper: {To: clamp, Duration: 0.35}           # legacy: loader_move('jaw', J_CLAMP, 0.35)
      - Wait: 0.25                                     # legacy: hold(0.25)
      - Vacuum: Off                                    # legacy: event('suction_off')
      - Wait: 0.2                                      # legacy: hold(0.2)
      - Movel: {To: above_loader, Speed: 0.20}         # legacy: linear_move(..., 'robot up from the loader', speed=0.20)

  - Name: home_after_handover
    Comment: "Back home, out of the loader's way."
    Allow_Contact: []
    Commands:
      - Movej: home                                 # legacy: joint_move(q_home, '-> home')

  - Name: loader_insert
    Comment: >-
      The loader lifts the PCB to the travel height, carries it to MG06, lowers it into the holder and opens the
      jaws; one axis after the other.
    Allow_Contact: []
    Commands:
      - Loader: {Axis: Z, To: travel_place, Duration: 0.8}   # legacy: loader_move('z', Z_TRAVEL, 0.8)
      - Loader: {Axis: Y, To: travel_place, Duration: 2.0}   # legacy: loader_move('y', YP, 2.0)
      - Loader: {Axis: Z, To: place, Duration: 0.6}          # legacy: loader_move('z', ZP, 0.6)
      - Wait: 0.1                                            # legacy: hold(0.1)
      - Gripper: {To: open, Duration: 0.35}                  # legacy: loader_move('jaw', J_OPEN, 0.35)
      - Wait: 0.1                                            # legacy: hold(0.1)

  - Name: loader_park
    Comment: "The loader rises out of MG06 and parks behind it (y -199.5 mm, z +20 mm) while the robot works MG06."
    Allow_Contact: []
    Commands:
      - Loader: {Axis: Z, To: travel_place, Duration: 0.5}   # legacy: loader_move('z', Z_TRAVEL, 0.5)
      - Loader: {Axis: Y, To: park, Duration: 1.8}           # legacy: loader_move('y', Y_PARK, 1.8)
      - Loader: {Axis: Z, To: park, Duration: 0.8}           # legacy: loader_move('z', Z_PARK, 0.8)
      - Wait: 0.15                                           # legacy: hold(0.15)

  - Name: to_mg06
    Comment: >-
      Over the free-space switch from the wrist-up to the wrist-down family (via_mg06_high, SPEC §4.7), above the
      handle, to the start of the recorded fork path. Joint moves only: a line never crosses wrist_2 = 0.
    Allow_Contact: []
    Commands:
      - Movej: via_mg06_high                        # legacy: the via joint_move inserted (SPEC §4.10)
      - Movej: above_handle                         # legacy: joint_move(q_fvia, 'home -> above the handle')
      - Movej: fork_start                           # legacy: joint_move(q_f0, '-> fork start pose')

  - Name: close_mg06
    Comment: >-
      The recorded closing path (lid down, handle to 29 deg; SPEC §4.9), then the bar to the centre of the fork
      slot, 2 mm off its bottom, at 20 mm/s (SPEC §4.10).
    Allow_Contact: [handle_bar]
    Commands:
      - Path: Fork_Close                               # legacy: replay(..., 'close MG06')
      - Movel: {To: fork_bar_centred, Speed: 0.02}     # legacy: linear_move(p_c, ..., 'bar to the slot centre', speed=0.02)

  - Name: leave_mg06
    Comment: "Out of the bar 90 mm along the slot, then 120 mm up; MG06 stays closed (SPEC §4.10)."
    Allow_Contact: []
    Commands:
      - Movel: {To: fork_out_of_bar, Speed: 0.12}      # legacy: linear_move(p_out, ..., speed=0.12)
      - Movel: {To: fork_retreat_up, Speed: 0.25}      # legacy: linear_move(p_up, ..., 'up', speed=0.25)

  - Name: test
    Comment: "MG06 closed, the PCB inside, the robot away above the slot exit: the tester runs."
    Allow_Contact: []
    Commands:
      - Test: Process.Test_Duration                 # Cell.yaml (owner, 2026-10-24); legacy held 1.0 s here

  - Name: return_mg06
    Comment: "Back down and along the slot onto the bar centre, the same path as the leave, MG06 still closed."
    Allow_Contact: []
    Commands:
      - Movel: {To: fork_out_of_bar, Speed: 0.25}      # legacy: linear_move(p_out, ..., 'down', speed=0.25)
      - Movel: {To: fork_bar_centred, Speed: 0.12}     # legacy: linear_move(p_c, ..., 'fork onto the bar', speed=0.12)

  - Name: open_mg06
    Comment: >-
      The slot wall onto the bar from below at 30 mm/s, where the recorded opening path's handle is already below
      the real closed angle (the handle is never pushed down, SPEC §4.7), then the recorded opening path.
    Allow_Contact: [handle_bar]
    Commands:
      - Movel: {To: fork_open_join, Speed: 0.03}       # legacy: linear_move(..., 'slot wall onto the bar (upwards)', speed=0.03)
      - Path: Fork_Open                                # legacy: replay(i_open[i_open > k], 'open MG06')

  - Name: home_after_mg06
    Comment: >-
      Above the handle, back over the free-space family switch, home: joint moves only. A direct move from above
      the handle to home drives the fork 8.4 mm through the handle bar (F8.5).
    Allow_Contact: []
    Commands:
      - Movej: above_handle                         # legacy: joint_move(q_fvia, 'away from the handle')
      - Movej: via_mg06_high                        # legacy: the via joint_move(q_home) inserted (in the reference plan)
      - Movej: home                                 # legacy: joint_move(q_home, '-> home')

  - Name: loader_fetch
    Comment: "The loader goes back to MG06 at the travel height, down into the holder, and clamps the tested PCB."
    Allow_Contact: []
    Commands:
      - Loader: {Axis: Z, To: travel_place, Duration: 0.6}   # legacy: loader_move('z', Z_TRAVEL, 0.6)
      - Loader: {Axis: Y, To: travel_place, Duration: 2.2}   # legacy: loader_move('y', YP, 2.2)
      - Loader: {Axis: Z, To: place, Duration: 0.6}          # legacy: loader_move('z', ZP, 0.6)
      - Wait: 0.1                                            # legacy: hold(0.1)
      - Gripper: {To: clamp, Duration: 0.35}                 # legacy: loader_move('jaw', J_CLAMP, 0.35)
      - Wait: 0.2                                            # legacy: hold(0.2)

  - Name: loader_return
    Comment: "The loader lifts the PCB out of MG06 and brings it home to the handover position."
    Allow_Contact: []
    Commands:
      - Loader: {Axis: Z, To: travel_place, Duration: 0.6}   # legacy: loader_move('z', Z_TRAVEL, 0.6)
      - Loader: {Axis: Y, To: home, Duration: 2.0}           # legacy: loader_move('y', Y0, 2.0)
      - Loader: {Axis: Z, To: home, Duration: 0.8}           # legacy: loader_move('z', 0.0, 0.8)
      - Wait: 0.2                                            # legacy: hold(0.2)

  - Name: to_take
    Comment: "From home to 160 mm above the PCB in the jaws, along the plate normal."
    Allow_Contact: []
    Commands:
      - Movej: above_loader                         # legacy: joint_move(q_via, 'home -> above the loader')

  - Name: take_from_loader
    Comment: >-
      Down along the plate normal, the last 15 mm at 30 mm/s until the cups are pressed 1.5 mm onto the PCB in the
      jaws, vacuum on, the jaws open, slowly out of the jaws, then up.
    Allow_Contact: [cups_pcb, pcb_jaws]
    Commands:
      - Movel: {To: loader_approach, Speed: 0.20}      # legacy: linear_move(..., 'down to the loader', speed=0.20)
      - Movel: {To: loader_take_press, Speed: 0.03}    # legacy: linear_move(..., 'cups onto the PCB', speed=0.03)
      - Vacuum: On                                     # legacy: event('suction_on')
      - Wait: 0.3                                      # legacy: hold(0.3)
      - Gripper: {To: open, Duration: 0.35}            # legacy: loader_move('jaw', J_OPEN, 0.35)
      - Wait: 0.15                                     # legacy: hold(0.15)
      - Movel: {To: loader_out_of_jaws, Speed: 0.05}   # legacy: linear_move(..., 'up out of the jaws', speed=0.05)
      - Movel: {To: above_loader, Speed: 0.20}         # legacy: linear_move(..., 'up', speed=0.20)

  - Name: to_output
    Comment: "Carry the PCB over a free-space via to 120 mm above the output crate."
    Allow_Contact: [cups_pcb]
    Commands:
      - Movej: via_loader_to_output                 # legacy: the via joint_move inserted (SPEC §4.10)
      - Movej: above_output                         # legacy: joint_move(q_ca, '-> above crate 2')

  - Name: place_output
    Comment: >-
      Straight down into the output crate, the last 15 mm at 30 mm/s, to 1 mm above the crate floor, vacuum off,
      straight up out of the crate.
    Allow_Contact: [cups_pcb, pcb_crate]
    Commands:
      - Movel: {To: output_approach, Speed: 0.20}      # legacy: linear_move(..., 'down into crate 2', speed=0.20)
      - Movel: {To: output_place, Speed: 0.03}         # legacy: linear_move(..., 'PCB down to the crate floor', speed=0.03)
      - Vacuum: Off                                    # legacy: event('suction_off')
      - Wait: 0.3                                      # legacy: hold(0.3)
      - Movel: {To: above_output, Speed: 0.20}         # legacy: linear_move(..., 'up', speed=0.20)

  - Name: home_end
    Comment: "Back home: the cycle is finished."
    Allow_Contact: []
    Commands:
      - Movej: home                                 # legacy: joint_move(q_home, '-> home')

  - Name: settle
    Comment: "Everything holds, so the PCB settles in the output crate before the cycle ends."
    Allow_Contact: []
    Commands:
      - Wait: 0.8                                   # legacy: hold(0.8)
