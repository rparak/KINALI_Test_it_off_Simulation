## =========================================================================== ##
#   Description:
#     The cell configuration of Test-it-off Simulation: the robot's base pose, the vacuum, the MG06
#     closed state, the clearances and tolerances of the keypoint and program checks, the handover's
#     no-press rule, the robot's motion limits, the MG06 test time, the acceptance limits of a cycle
#     run, and two settings of the run (SPEC §8).
#     Read only by src/Configuration/Core.py (Load_Cell_Configuration); written by hand.
#
#   REQUIRED: every field is required; a missing or invalid field fails the load, naming it.
#   Units: in brackets after each field's comment; lengths [m], angles [deg], angular speeds [deg/s] and
#     accelerations [deg/s^2], times [s], pressure [Pa]. The loader converts degrees to radians once.
#   Frames: positions in the MG06 fixture frame (origin = centre of the MG06 footprint on the table top,
#     Z up, front of MG06 = -Y; SPEC §4.2).
#   Not here, on purpose: the joint limits and the loader axis ranges (the model holds them: the vendored
#     robot MJCF and models/scene.xml); the loader positions and gripper commands (Configuration/Constants.yaml);
#     the loader and gripper move times (each command of the program carries its own, with its source).
## =========================================================================== ##

# The AUBO i5 on the robot pedestal.
Robot:
  # The robot base: the top of the plate deska_robot, the CAD origin of the cell. Source: CAD
  # (Test_it_off_-_Copy.blend), SPEC §4.2. [m] REQUIRED.
  Base_Position: [0.42072, -0.33497, 0.16200]
  # The base's rotation about Z: every task lies within about +-65 deg of the pan joint's zero (the
  # reference plan uses -64.7 .. +60.2 deg). Source: SPEC §4.2, §4.10. [deg] REQUIRED.
  Base_Yaw: -135.0

# The OnRobot VGC10's four suction cups: one adhesion actuator per cup, force = pressure x cup area
# (derived, not stored: 4 x pi x 0.0075^2 x 40e3 = 28 N, 7 N per cup).
Vacuum:
  # The vacuum, within the VGC10 datasheet's recommended 20-60 %. Source: OnRobot VGC10 datasheet,
  # SPEC §4.3. [Pa] REQUIRED.
  Pressure: 40000.0
  # The silicone cup diameter (D15). Source: OnRobot VGC10 datasheet, SPEC §4.1. [m] REQUIRED.
  Cup_Diameter: 0.015

# The MG06 fixture's settled closed state (the open state is the lid's stop in models/scene.xml).
MG06:
  # The lid after closing, risen in the lock's play. Source: measured in the cell simulation, the
  # legacy planner's LID_CLOSED (commit f754e2d0379b06ffb43286f4fb7aabf88e25ca5f), SPEC §4.7. [deg] REQUIRED.
  Closed_Lid: -0.5
  # The handle after closing, the robot away. Source: as above, H_CLOSED, SPEC §4.7. [deg] REQUIRED.
  Closed_Handle: 28.65
  # PATH_FORK_OPEN joins the recorded opening path at its first row whose handle is this far below
  # Closed_Handle (28.45 deg), so the fork's slot wall meets the bar moving up and the handle is never
  # pushed down (SPEC §4.7, §4.9). Source: the legacy planner (H_CLOSED - 0.2; commit
  # f754e2d0379b06ffb43286f4fb7aabf88e25ca5f). [deg] REQUIRED.
  Open_Join_Margin: 0.2

# The keypoint check (SPEC §2 item 3).
Clearance:
  # The smallest distance from the robot, the tool and the carried PCB to the scene (MG06, workstation,
  # crates, loader), except a keypoint's declared contacts. Source: SPEC §2 items 3-4. [m] REQUIRED.
  Robot: 0.003
  # The deepest contact a keypoint or a program step may declare per group; a deeper overlap fails even
  # where the group is allowed. cups_pcb: the cups pressed 1.5 mm onto the PCB (SPEC §4.7) plus 0.1 mm;
  # handle_bar: the fork on the bar of the recorded path; pcb_crate: the PCB on a crate floor (and on the
  # table under it); pcb_jaws: the carried PCB between the loader's jaws at the handover and the take -
  # each 0.5 mm (owner, 2026-10-24), except handle_bar: PATH_FORK_CLOSE's recorded path overlaps the bar by
  # 0.539 mm at one row (physics-verified path, up to 294 N); measured + margin, 0.6 mm (owner,
  # 2026-10-24). [m] REQUIRED.
  Allowed_Depth:
    cups_pcb: 0.0016
    handle_bar: 0.0006
    pcb_crate: 0.0005
    pcb_jaws: 0.0005
  # A derived point's FK (Constants.yaml Reference + Offset, Simulation.yaml PCB_Hold) against its target
  # before it counts as stale: the legacy IK left up to 24 um on the legacy points (measured 2026-10-24, FEATURES.md
  # F6); the largest now 0.026 mm, P_INPUT_CLEAR (test/Program/data/golden_keypoint_table.txt). [m] REQUIRED.
  Stale_Position: 0.00005
  # The same, for the orientation. Source: as above (measured at most 0.0001 deg). [deg] REQUIRED.
  Stale_Angle: 0.01
  # Within this angle of zero, wrist_2's sign does not decide the IK family: a WARNING, not a FAIL
  # (P_VIA_HOME_MG06 is at -0.94 deg: the switch between the families, SPEC §4.7). [deg] REQUIRED.
  Family_Margin: 1.0
  # The program check measures a sample whenever a robot geom or the carried PCB may have moved more
  # than this since the last measured sample (bounded through the joint steps), and at every segment
  # end. Source: proposed in FEATURES.md F8, approved by the owner 2026-10-24. [m] REQUIRED.
  Check_Step: 0.001
  # The smallest distance from the robot, the tool and the carried PCB to the loader (its carriages and jaws, and
  # the PCB they hold) in every free-space transfer (Optimization.yaml Free_Segments of the taught program, the
  # optimized program's MoveSpline segments); the work at the loader (the handover, the take) keeps Robot.
  # The loader is posed where its actuator model puts it (the 30 ms filter, the servo, the axis mass), not at its
  # command. Source: owner, 2026-10-24: more room around the loader in free transfers. [m] REQUIRED.
  Loader_Free: 0.010
  # Added to Loader_Free for the kinematic checks and the planner: the robot's largest deviation from its
  # reference in the free transfers in physics, 2.51 mm (the optimized S13_To_Output), plus the loader actuator
  # model's error against physics, 1.04 mm (z; y 0.17 mm); measured F11, 2026-10-25; rounded up. [m] REQUIRED.
  Tracking_Margin: 0.004

# The handover's no-press rule (SPEC §4.7): the PCB is put into the open jaws at the hold pose without
# pressing it onto the finger ledges, so the jaws do not clamp on the ledge corners.
Handover:
  # The gap between the PCB and the finger ledges at P_LOADER_PLACE, the jaws closed on it: 0.3 mm
  # (SPEC §4.7; measured 0.299 mm, test/Program/data/golden_check_report.txt). [m] REQUIRED.
  Ledge_Gap: 0.0003
  # The gap may differ from Ledge_Gap by at most this; a smaller gap is a press and fails. Source: the
  # owner, 2026-10-24 (B1). [m] REQUIRED.
  Ledge_Tolerance: 0.0001
  # The PCB centre's largest lateral offset from the jaw centreline at P_LOADER_PLACE (along the jaw axis, the
  # kinematic PCB on the cups): the jaws centre the PCB as they clamp, so a larger offset pulls it off the cups.
  # Source: the owner, 2026-10-25 (B work, item 1). [m] REQUIRED.
  Lateral_Max: 0.0005

# The robot's motion limits for the program's MoveJ and MoveL (SPEC §4.4, §4.10).
Motion:
  # The fraction of the datasheet joint speeds the program runs at. Source: the reference plan (the
  # legacy planner's SPEED, commit f754e2d0379b06ffb43286f4fb7aabf88e25ca5f), SPEC §4.4. [-] REQUIRED.
  Speed_Fraction: 0.6
  # The joint speeds, shoulder_pan .. wrist_3. Source: AUBO i5 datasheet (J1-J4 220 deg/s, J5-J6
  # 230 deg/s), SPEC §4.4. [deg/s] REQUIRED.
  Datasheet_Speeds: [220.0, 220.0, 220.0, 220.0, 230.0, 230.0]
  # The joint accelerations (= 3 rad/s^2 for J1-J3, 6 rad/s^2 for J4-J6). An ASSUMPTION, not in the
  # datasheet (SPEC §4.4, KNOWN_ISSUES.md). Source: the legacy planner's AMAX. [deg/s^2] REQUIRED.
  Acceleration_Limits: [171.88733853924697, 171.88733853924697, 171.88733853924697,
                        343.77467707849394, 343.77467707849394, 343.77467707849394]
  # The shortest MoveJ (min-jerk; SPEC §4.10). Source: the legacy planner's _jpath. [s] REQUIRED.
  Movej_Min_Duration: 0.5
  # The shortest MoveL. Source: the legacy planner's linear_move. [s] REQUIRED.
  Movel_Min_Duration: 0.6
  # The loader gripper's largest jaw speed: a Gripper command's ramp peaks at 1.875 x its mean speed (min-jerk),
  # so a full stroke from G_OPEN to G_CLAMP (29.25 mm per jaw) takes at least 0.55 s. Source: SCHUNK EGI 040-EI
  # (ID 1474382) data sheet, max. speed 100 mm/s (read 2026-10-25). [m/s per jaw] REQUIRED.
  Jaw_Speed_Max: 0.1

# The process times the program refers to.
Process:
  # The MG06 test: the time the tester needs once the PCB is inside and MG06 is closed; the robot waits
  # away from the handle (the program's Test: Process.Test_Duration). A PLACEHOLDER: the real test time
  # of the customer's PCB is not known. Source: the owner, 2026-10-24 (KNOWN_ISSUES.md). [s] REQUIRED.
  Test_Duration: 2.0

# The acceptance criteria of a cycle run (SPEC §10.1).
Acceptance:
  # PCB in MG06: the position error and the tilt against the place target. Source: brief §5.6. [m] REQUIRED.
  Place_Error: 0.0005
  # [deg] REQUIRED.
  Place_Tilt: 0.2
  # PCB in the output crate: the horizontal distance from the crate centre. Source: brief §5.6. [m] REQUIRED.
  Crate_Distance: 0.002
  # MG06 ends open: the lid within this of its open stop and the handle within this of zero. Source: SPEC
  # §10.1 item 5 (a decision, design-decisions). [deg] REQUIRED.
  Open_Tolerance: 2.0
  # The deepest PCB penetration in any group. Source: the owner, 2026-10-24 (SPEC §10.1 item 7). [m] REQUIRED.
  Penetration: 0.0005
  # A program's physics run: the robot and the carried PCB at least this far from the loader in every free
  # transfer (closer than Clearance.Loader_Free is a WARNING). Source: the owner, 2026-10-24 (F11). [m] REQUIRED.
  Loader_Distance: 0.001
  # A program's physics run fails (and warns) above these: the PCB's slip in the cups and the robot's joint
  # tracking error, 1.5 x the legacy run's 1.32 mm and 0.0126 rad (commit 7a8560c8c16806739a02da8e989c2a2f65d1e41d). Source: the
  # owner, 2026-10-24 (F11: warnings), 2026-10-25 (step 6: bounds). [m], [rad] REQUIRED.
  Slip_Max: 0.00198
  Tracking_Max: 0.0189
  # The fork on the MG06 handle bar while it closes and opens MG06: the net contact force on the bar and the
  # handle hinge load (its constraint torque), the worst of the force's two modes x 1.15, rounded up (247.3 N,
  # 11.45 N m; F11, design-decisions): regression bounds derived from the simulation, not safety limits - the real
  # handle's, fork's and VGC10's ratings are not known (KNOWN_ISSUES.md). Source: the owner,
  # 2026-10-25 (step 6). [N], [N m] REQUIRED.
  Fork_Net_Force_Max: 290.0
  Handle_Load_Max: 13.5
  # The loader's place into MG06 (B work, items 7 and 9; owner, 2026-10-25): while the jaws are closed at L_PLACE the
  # PCB - holder contact force at most Place_Holder_Force (no press); after the jaws release it the deepest PCB - holder
  # penetration at most Release_Penetration while it drops, and the settled one at most Rest_Penetration (measured at
  # rest under its own weight, B.1: 0.0002 mm) + Settle_Margin. Release_Penetration 0.1 mm (owner, 2026-10-25; was 0.05): the
  # handover margin runs reach 0.068 mm with the PCB 0.5 mm off the cups' centre; it still catches the old pressed place
  # (0.157 / 0.181 mm). [N], [m] REQUIRED.
  Place_Holder_Force: 1.0
  Release_Penetration: 0.0001
  Rest_Penetration: 0.0000002
  Settle_Margin: 0.00001
  # Seated (item 9): Seat_Time after the jaws release the PCB it rests on at least Seat_Supports of the holder's four
  # supports, each within Seat_Height, slower than Seat_Speed, tilted less than Seat_Tilt from its place pose, touching no
  # side guide and no jaw. Source: the owner, 2026-10-25. [s], [-], [m], [m/s], [deg] REQUIRED.
  Seat_Time: 0.2
  Seat_Supports: 3
  Seat_Height: 0.00005
  Seat_Speed: 0.001
  Seat_Tilt: 0.1

# Two settings of the physics run, kept from the legacy run (SPEC §10.1). Their sensitivity, checked on both programs
# 2026-10-25 (design-decisions): 10 phase steps or a 0.1 mm cup touch move no metric and no verdict.
Simulation:
  # The phase label is refreshed every this many steps. Source: legacy/test_cell_cycle.py (commit
  # f754e2d0379b06ffb43286f4fb7aabf88e25ca5f). [-] REQUIRED.
  Phase_Steps: 20
  # A cup counts as touching the PCB below this contact distance. Source: as above. [m] REQUIRED.
  Cup_Touch: 0.0005
