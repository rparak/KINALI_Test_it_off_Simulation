[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinali_sim"
version = "0.1.0"
description = "MuJoCo simulation of the KINALI 'Test it off' automated PCBA test cell"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mujoco==3.16.0",          # the physics is verified on this version (docs/baseline_report.txt)
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
video = ["imageio[ffmpeg]", "pillow"]    # legacy/test_cell_cycle.py --render

[project.scripts]
kinali-sim = "kinali_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full physics cycle (about 20 s)"]
