## =========================================================================== ##
#   Description:
#     The OPTIMIZED program of the Test-it-off cell (FEATURES.md F9), WRITTEN by Example/Program/optimize_program.py
#     from Configuration/Program.yaml and Configuration/Optimization.yaml - never edit it by hand: change those and
#     run the optimizer again. Read by src/Configuration/Program_Parser.py (Load_Program), the same format as
#     Program.yaml plus Robot.MoveSpline, Loader.Start / Loader.WaitDone, Waypoints and the Optimized record.
#     LOCKED segments are copied verbatim from Program.yaml (renumbered); each FREE transfer is a planned joint
#     spline (RRT-Connect from a fixed seed, shortcut, spline, time-optimal timing) with the loader jobs between
#     its taught segments running in parallel. A build refuses this file when an input changed (Optimized.Inputs).
#     Simulation results only: NOT validated for driving the real cell (KNOWN_ISSUES.md: MoveSpline on the
#     controller).
#   Units: Waypoints [deg], v= the fraction of the datasheet joint speeds, Schedule [s].
## =========================================================================== ##

# The robot's program: the whole cycle.
Program:
  # FREE (planned, F9): P_HOME to P_INPUT_ABOVE, replacing the taught S1_Approach_Input.
  S1_Approach_Input:
    - Robot.MoveSpline(W_APPROACH_INPUT, v=0.6)

  # Straight down to 15 mm above the PCB, the last 15 mm at 30 mm/s until the cups are pressed 1.5 mm onto it
  # (SPEC §4.7), vacuum on, wait for it, straight up until the board clears the crate's 149 mm walls.
  S2_Pick_Input:
    - Robot.MoveL(P_INPUT_APPROACH, v=0.20)               # legacy: linear_move(..., 'down into crate 1', speed=0.20)
    - Robot.MoveL(P_INPUT_PICK, v=0.03)                   # legacy: linear_move(..., 'cups onto the PCB', speed=0.03)
    - Robot.SetDO(DO_VACUUM, ON)                          # legacy: event('suction_on')
    - Robot.WaitDI(DI_VACUUM_OK, timeout=1.0)             # legacy: hold(0.3)
    - Robot.MoveL(P_INPUT_CLEAR, v=0.20)                  # legacy: linear_move(..., 'up out of the crate', speed=0.20), to 170 mm (F8.5)

  # FREE (planned, F9): P_INPUT_CLEAR to P_LOADER_ABOVE, replacing the taught S3_To_Loader.
  S3_To_Loader:
    - Robot.MoveSpline(W_TO_LOADER, v=0.6)

  # Down along the plate normal into the open jaws, the last 15 mm at 30 mm/s, to the hold pose with no press: the
  # board stays 0.3 mm above the finger ledges (SPEC §4.7). The jaws clamp, vacuum off, straight back up.
  S4_Handover:
    - Robot.MoveL(P_LOADER_APPROACH, v=0.20)              # legacy: linear_move(..., 'down to the loader', speed=0.20)
    - Robot.MoveL(P_LOADER_PLACE, v=0.03)                 # legacy: linear_move(..., 'PCB into the open jaws', speed=0.03)
    - Loader.Run(J_CLAMP)
    - Wait(0.25)                                          # legacy: hold(0.25)
    - Robot.SetDO(DO_VACUUM, OFF)                         # legacy: event('suction_off')
    - Wait(0.2)                                           # legacy: hold(0.2)
    - Robot.MoveL(P_LOADER_ABOVE, v=0.20)                 # legacy: linear_move(..., 'robot up from the loader', speed=0.20)

  # FREE (planned, F9): P_LOADER_ABOVE to P_MG06_FORK_START, replacing the taught S5_Home_After_Handover,
  # S6_Loader_Insert, S7_Loader_Park, S8_To_MG06. The loader runs J_INSERT, J_PARK in parallel.
  S5_To_MG06:
    - Loader.Start(J_INSERT)
    - Robot.MoveSpline(W_TO_MG06, v=0.6)
    - Loader.WaitDone(J_INSERT)
    - Loader.Start(J_PARK)
    - Loader.WaitDone(J_PARK)

  # The recorded closing path (lid down, handle to 29 deg; SPEC §4.9), then the bar to the centre of the fork slot,
  # 2 mm off its bottom, at 20 mm/s (SPEC §4.10).
  S6_Close_MG06:
    - Robot.MovePath(PATH_FORK_CLOSE)                     # legacy: replay(..., 'close MG06')
    - Robot.MoveL(P_MG06_BAR_CENTRE, v=0.02)              # legacy: linear_move(p_c, ..., 'bar to the slot centre', speed=0.02)

  # Out of the bar 90 mm along the slot, then 120 mm up; MG06 stays closed (SPEC §4.10).
  S7_Leave_MG06:
    - Robot.MoveL(P_MG06_SLOT_EXIT, v=0.12)               # legacy: linear_move(p_out, ..., speed=0.12)
    - Robot.MoveL(P_MG06_WAIT, v=0.25)                    # legacy: linear_move(p_up, ..., 'up', speed=0.25)

  # MG06 closed, the PCB inside, the robot away above the slot exit: the tester runs.
  S8_Test:
    - Tester.Run(J_TEST)

  # Back down and along the slot onto the bar centre, the same path as the leave, MG06 still closed.
  S9_Return_MG06:
    - Robot.MoveL(P_MG06_SLOT_EXIT, v=0.25)               # legacy: linear_move(p_out, ..., 'down', speed=0.25)
    - Robot.MoveL(P_MG06_BAR_CENTRE, v=0.12)              # legacy: linear_move(p_c, ..., 'fork onto the bar', speed=0.12)

  # The slot wall onto the bar from below at 30 mm/s, where the recorded opening path's handle is already below the
  # real closed angle (the handle is never pushed down, SPEC §4.7), then the recorded opening path.
  S10_Open_MG06:
    - Robot.MoveL(P_MG06_OPEN_JOIN, v=0.03)               # legacy: linear_move(..., 'slot wall onto the bar (upwards)', speed=0.03)
    - Robot.MovePath(PATH_FORK_OPEN)                      # legacy: replay(i_open[i_open > k], 'open MG06')

  # FREE (planned, F9): P_MG06_FORK_START to P_LOADER_ABOVE, replacing the taught S14_Home_After_MG06,
  # S15_Loader_Fetch, S16_Loader_Return, S17_To_Take. The loader runs J_FETCH, J_RETURN in parallel. The robot waits
  # at P_LOADER_WAIT meanwhile.
  S11_To_Take:
    - Loader.Start(J_FETCH)
    - Robot.MoveSpline(W_TO_TAKE_WAIT, v=0.6)
    - Loader.WaitDone(J_FETCH)
    - Loader.Start(J_RETURN)
    - Wait(1.648)
    - Robot.MoveSpline(W_TO_TAKE, v=0.6)
    - Loader.WaitDone(J_RETURN)

  # Down along the plate normal, the last 15 mm at 30 mm/s until the cups are pressed 1.5 mm onto the PCB in the
  # jaws, vacuum on, back to touch (the press relieved, SPEC §4.7), the jaws open, the vacuum still OK, slowly out
  # of the jaws, then up.
  S12_Take_From_Loader:
    - Robot.MoveL(P_LOADER_APPROACH, v=0.20)              # legacy: linear_move(..., 'down to the loader', speed=0.20)
    - Robot.MoveL(P_LOADER_PICK, v=0.03)                  # legacy: linear_move(..., 'cups onto the PCB', speed=0.03)
    - Robot.SetDO(DO_VACUUM, ON)                          # legacy: event('suction_on')
    - Robot.WaitDI(DI_VACUUM_OK, timeout=1.0)             # legacy: hold(0.3)
    - Robot.MoveL(P_LOADER_TAKE_TOUCH, v=0.01)            # owner, 2026-10-24 (F11): relieve the bellows before the jaws open
    - Loader.Run(J_RELEASE)
    - Robot.WaitDI(DI_VACUUM_OK, timeout=1.0)             # owner, 2026-10-24 (F11): the PCB is still held after the release
    - Wait(0.15)                                          # legacy: hold(0.15)
    - Robot.MoveL(P_LOADER_EXIT, v=0.05)                  # legacy: linear_move(..., 'up out of the jaws', speed=0.05)
    - Robot.MoveL(P_LOADER_ABOVE, v=0.20)                 # legacy: linear_move(..., 'up', speed=0.20)

  # FREE (planned, F9): P_LOADER_ABOVE to P_OUTPUT_ABOVE, replacing the taught S19_To_Output.
  S13_To_Output:
    - Robot.MoveSpline(W_TO_OUTPUT, v=0.6)

  # Straight down into the output crate, the last 15 mm at 30 mm/s, to 1 mm above the crate floor, vacuum off,
  # straight up out of the crate.
  S14_Place_Output:
    - Robot.MoveL(P_OUTPUT_APPROACH, v=0.20)              # legacy: linear_move(..., 'down into crate 2', speed=0.20)
    - Robot.MoveL(P_OUTPUT_PLACE, v=0.03)                 # legacy: linear_move(..., 'PCB down to the crate floor', speed=0.03)
    - Robot.SetDO(DO_VACUUM, OFF)                         # legacy: event('suction_off')
    - Wait(0.3)                                           # legacy: hold(0.3)
    - Robot.MoveL(P_OUTPUT_ABOVE, v=0.20)                 # legacy: linear_move(..., 'up', speed=0.20)

  # FREE (planned, F9): P_OUTPUT_ABOVE to P_HOME, replacing the taught S21_Home_End.
  S15_Home_End:
    - Robot.MoveSpline(W_HOME_END, v=0.6)

# The loader's jobs (its PLC): one axis after the other.
Loader_Jobs:
  # Clamp the PCB the robot holds at the handover.
  J_CLAMP:
    - Gripper(G_CLAMP, t=0.6)                             # legacy: loader_move('jaw', J_CLAMP, 0.35); 0.6 s: the EGI's 100 mm/s (Cell.yaml Jaw_Speed_Max)

  # Lift the PCB to the travel height, carry it to MG06, lower it into the holder, open.
  J_INSERT:
    - MoveZ(L_TRAVEL, t=0.8)                              # legacy: loader_move('z', Z_TRAVEL, 0.8)
    - MoveY(L_TRAVEL, t=2.0)                              # legacy: loader_move('y', YP, 2.0)
    - MoveZ(L_PLACE, t=0.6)                               # legacy: loader_move('z', ZP, 0.6)
    - Wait(0.1)                                           # legacy: hold(0.1)
    - Gripper(G_OPEN, t=0.6)                              # legacy: loader_move('jaw', J_OPEN, 0.35); 0.6 s: the EGI's 100 mm/s (Cell.yaml Jaw_Speed_Max)
    - Wait(0.1)                                           # legacy: hold(0.1)

  # Rise out of MG06 and park behind it (y -199.5 mm, z +20 mm).
  J_PARK:
    - MoveZ(L_TRAVEL, t=0.5)                              # legacy: loader_move('z', Z_TRAVEL, 0.5)
    - MoveY(L_PARK, t=1.8)                                # legacy: loader_move('y', Y_PARK, 1.8)
    - MoveZ(L_PARK, t=0.8)                                # legacy: loader_move('z', Z_PARK, 0.8)
    - Wait(0.15)                                          # legacy: hold(0.15)

  # Back to MG06 at the travel height, down to the re-grip height (its own: the ledge rule), clamp the tested PCB.
  J_FETCH:
    - MoveZ(L_TRAVEL, t=0.6)                              # legacy: loader_move('z', Z_TRAVEL, 0.6)
    - MoveY(L_TRAVEL, t=2.2)                              # legacy: loader_move('y', YP, 2.2)
    - MoveZ(L_FETCH, t=0.6)                               # legacy: loader_move('z', ZP, 0.6); L_FETCH since B work item 5
    - Wait(0.1)                                           # legacy: hold(0.1)
    - Gripper(G_CLAMP, t=0.6)                             # legacy: loader_move('jaw', J_CLAMP, 0.35); 0.6 s: the EGI's 100 mm/s (Cell.yaml Jaw_Speed_Max)
    - Wait(0.2)                                           # legacy: hold(0.2)

  # Lift the PCB out of MG06 and bring it home to the take position.
  J_RETURN:
    - MoveZ(L_TRAVEL, t=0.6)                              # legacy: loader_move('z', Z_TRAVEL, 0.6)
    - MoveY(L_HOME, t=2.0)                                # legacy: loader_move('y', Y0, 2.0)
    - MoveZ(L_HOME, t=0.8)                                # legacy: loader_move('z', 0.0, 0.8)
    - Wait(0.2)                                           # legacy: hold(0.2)

  # Release the PCB the robot has taken (the vacuum holds it).
  J_RELEASE:
    - Gripper(G_OPEN, t=0.6)                              # legacy: loader_move('jaw', J_OPEN, 0.35); 0.6 s: the EGI's 100 mm/s (Cell.yaml Jaw_Speed_Max)

# The tester's job (MG06).
Tester_Jobs:
  # The MG06 test, for Cell.yaml's Process.Test_Duration (a placeholder, KNOWN_ISSUES.md).
  J_TEST:
    - Test(Process.Test_Duration)                         # legacy held 1.0 s here (owner, 2026-10-24: 2.0 s)

