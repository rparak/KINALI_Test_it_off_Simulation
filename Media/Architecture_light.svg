<path d="M602 145.5 L609 150.0 L602 154.5 Z" fill="#666666"/>
<line x1="789" y1="150.0" x2="801" y2="150.0" stroke="#666666" stroke-width="1.5"/>
<path d="M800 145.5 L807 150.0 L800 154.5 Z" fill="#666666"/>
<line x1="987" y1="150.0" x2="999" y2="150.0" stroke="#666666" stroke-width="1.5"/>
<path d="M998 145.5 L1005 150.0 L998 154.5 Z" fill="#666666"/>
<path d="M501.0 228 V298 H560.0 V338" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M897.0 228 V298 H640.0 V338" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M222 238 V246 H978 V238" fill="none" stroke="#666666" stroke-width="1"/>
<rect x="506.0" y="252" width="188" height="20" fill="#FFFFFF"/>
<text x="600.0" y="267" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#404040">cell.py all runs 02 → 05</text>
<text x="600.0" y="290" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#666666">view at any time</text>
<text x="493.0" y="302" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666">the motion</text>
<text x="905.0" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666">the physics</text>
<rect x="470.5" y="338.5" width="259" height="129" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
<text x="486.0" y="376" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0A0A">Show</text>
<text x="486.0" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#404040">Watch the motion,</text>
<text x="486.0" y="417" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#404040">or the physics with --physics</text>
<rect x="486.5" y="432.5" width="97.0" height="21" rx="5" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1"/>
<text x="493.0" y="447" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#0A0A0A">cell.py show</text>
<text x="600.0" y="498" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#666666">Simulation results only: not validated for the real cell</text>
