<path d="M206 145.5 L213 150.0 L206 154.5 Z" fill="#666666"/>
<line x1="393" y1="150.0" x2="405" y2="150.0" stroke="#666666" stroke-width="1.5"/>
<path d="M404 145.5 L411 150.0 L404 154.5 Z" fill="#666666"/>
