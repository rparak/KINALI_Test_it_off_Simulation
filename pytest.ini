[pytest]
# importlib: several test_core.py files coexist without __init__.py. No -q here: the documented
# 'pytest -q' and 'pytest --collect-only -q' must still print their totals.
addopts = --import-mode=importlib
# The shipped skills' own tests run in the suite too (owner, 2026-10-28).
testpaths = test .claude/skills/project-style-rpx/scripts .claude/skills/readme-writer/scripts
markers =
    slow: takes more than about 10 s (deselect with -m "not slow")
